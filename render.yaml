# Render Infrastructure-as-Code Blueprint definition.
# Deploys the unified single-process platform connected to Neon DB and Render Redis.

services:
  - type: web
    name: last-mile-platform
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python services/app.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NOMINATIM_URL
        sync: false
      - key: OSRM_URL
        sync: false
      - key: VROOM_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        sync: false
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_ROOT_USER
        sync: false
      - key: MINIO_ROOT_PASSWORD
        sync: false
      - key: CORE_API_URL
        sync: false
      - key: DRIVER_GATEWAY_URL
        sync: false
