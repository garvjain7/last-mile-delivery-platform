# Render Infrastructure-as-Code Blueprint definition.
# Deploys platform web services, background workers, and connects Neon DB & Render Redis.

services:
  - type: web
    name: core-api
    env: python
    buildCommand: pip install -r services/core_api/requirements.txt
    startCommand: uvicorn services.core_api.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NOMINATIM_URL
        sync: false

  - type: worker
    name: routing-worker
    env: python
    buildCommand: pip install -r services/routing_worker/requirements.txt
    startCommand: python -m services.routing_worker.app.main
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OSRM_URL
        sync: false
      - key: VROOM_URL
        sync: false

  - type: web
    name: control-tower
    env: python
    buildCommand: pip install -r services/control_tower/requirements.txt
    startCommand: uvicorn services.control_tower.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: REDIS_URL
        sync: false

  - type: web
    name: driver-gateway
    env: python
    buildCommand: pip install -r services/driver_gateway/requirements.txt
    startCommand: uvicorn services.driver_gateway.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: MINIO_ENDPOINT
        sync: false

  - type: worker
    name: simulator
    env: python
    buildCommand: pip install -r services/simulator/requirements.txt
    startCommand: python -m services.simulator.app.main
    envVars:
      - key: CORE_API_URL
        sync: false
      - key: DRIVER_GATEWAY_URL
        sync: false
