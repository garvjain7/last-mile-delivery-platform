# Split into profiles (infra vs core-apps) to save laptop RAM
# Orchestrates Postgres, Redis, OSRM, VROOM, Nominatim, MinIO, and platform backend services.

version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    profiles: ["infra", "all"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lastMileDB
    ports:
      - "5432:5432"

  redis:
    image: redis:7.2-alpine
    profiles: ["infra", "all"]
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2023-09-20T22-40-07Z
    profiles: ["infra", "all"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"

  osrm:
    image: osrm/osrm-backend:v5.27.1
    profiles: ["infra", "all"]
    ports:
      - "5000:5000"

  vroom:
    image: vroomexpress/vroom-docker:v1.13.0
    profiles: ["infra", "all"]
    ports:
      - "3000:3000"

  nominatim:
    image: memediasystem/nominatim:4.2
    profiles: ["infra", "all"]
    ports:
      - "8080:8080"

  core-api:
    build:
      context: .
      dockerfile: services/core_api/Dockerfile
    profiles: ["core-apps", "all"]
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  routing-worker:
    build:
      context: .
      dockerfile: services/routing_worker/Dockerfile
    profiles: ["core-apps", "all"]
    depends_on:
      - postgres
      - redis

  control-tower:
    build:
      context: .
      dockerfile: services/control_tower/Dockerfile
    profiles: ["core-apps", "all"]
    ports:
      - "8001:8001"
    depends_on:
      - redis

  driver-gateway:
    build:
      context: .
      dockerfile: services/driver_gateway/Dockerfile
    profiles: ["core-apps", "all"]
    ports:
      - "8002:8002"
    depends_on:
      - redis
      - minio

  simulator:
    build:
      context: .
      dockerfile: services/simulator/Dockerfile
    profiles: ["simulator", "all"]
