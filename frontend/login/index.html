<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Logistics Platform</title>
  <link rel="stylesheet" href="/static/shared/css/global.css">
  <style>
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 70px); /* Account for navbar */
    }
    .login-card {
      width: 100%;
      max-width: 400px;
    }
    .login-card h2 {
      margin-bottom: var(--space-xl);
      color: var(--color-primary);
      text-align: center;
    }
    .tabs {
      display: flex;
      margin-bottom: var(--space-lg);
      border-bottom: 1px solid var(--color-border);
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: var(--space-sm);
      cursor: pointer;
      color: var(--color-text-muted);
      border-bottom: 2px solid transparent;
    }
    .tab.active {
      color: var(--color-accent);
      border-bottom-color: var(--color-accent);
      font-weight: 500;
    }
    .auth-error {
      display: none;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="container">
      <div class="nav-brand"><a href="/" style="color: inherit; text-decoration: none;">Last-Mile Logistics</a></div>
    </div>
  </nav>

  <main class="login-container container">
    <div class="card login-card">
      <h2>Sign In</h2>
      
      <div class="tabs">
        <div class="tab active" id="tab-email" onclick="switchTab('email')">Email</div>
        <div class="tab" id="tab-phone" onclick="switchTab('phone')">Phone</div>
      </div>

      <div id="error-box" class="alert alert-error auth-error"></div>

      <form id="login-form">
        <!-- Email Input -->
        <div class="form-group" id="group-email">
          <label class="form-label" for="email">Email Address</label>
          <input class="form-input" type="email" id="email" name="email" placeholder="you@company.com">
        </div>

        <!-- Phone Input (Hidden by default) -->
        <div class="form-group hidden" id="group-phone">
          <label class="form-label" for="phone">Phone Number</label>
          <input class="form-input" type="text" id="phone" name="phone" placeholder="+1234567890">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Log In</button>
      </form>
    </div>
  </main>

  <script src="/static/login/login.js"></script>
</body>
</html>
